site:
  title: "Blog Engine MD"
  tagline: "A high-performance static site generator"
  url: "http://localhost"
  baseUrl: "/"
  language: "en"

i18n:
  default: "en"
  browserRedirect:
    enabled: false
  languages:
    - code: "en"
      label: "English"
      aliases: ["en", "en-us", "en-gb"]
    - code: "ru"
      label: "Русский"
      aliases: ["ru", "ru-ru"]

author:
  name: "Demo Author"
  email: "demo@example.com"

build:
  contentDir: "content"
  outputDir: "dist"
  parallelWorkers: 4

# Homepage customization
homepage:
  enabled: true
  hero:
    enabled: true
    # background: "/assets/images/hero-bg.jpg"
    title: "Blog Engine MD"
    subtitle: "High-Performance Static Site Generator"
    description: "Built with Go. Designed for speed, flexibility, and ease of use. Features wiki-style linking, graph visualization, and modern markdown support."
    ctaButtons:
      - label: "Get Started"
        url: "/docs/getting-started/"
        icon: "primary"
      - label: "View Blog"
        url: "/blog/"
  projects:
    - title: "Wiki-Style Links"
      description: "Link pages naturally with [[Page Title]] syntax. Automatic backlink tracking."
      image: "/assets/images/sample.svg"
      url: "/docs/advanced-features/"
      tags: ["Feature", "Links"]
    - title: "Graph Visualization"
      description: "Interactive graph view showing connections between all your content."
      image: "/assets/images/sample.svg"
      url: "/blog/exploring-the-graph-view/"
      tags: ["Feature", "Visualization"]
    - title: "Image Processing"
      description: "Automatic image optimization, responsive images, and WebP conversion."
      image: "/assets/images/sample.svg"
      url: "/blog/my-first-post/"
      tags: ["Feature", "Assets"]
  socialLinks:
    - title: "Documentation"
      links:
        - label: "Getting Started"
          url: "/docs/getting-started/"
        - label: "Advanced Features"
          url: "/docs/advanced-features/"
        - label: "About"
          url: "/docs/about/"
    - title: "Blog"
      links:
        - label: "First Post"
          url: "/blog/my-first-post/"
        - label: "Graph View"
          url: "/blog/exploring-the-graph-view/"
    - title: "Connect"
      links:
        - label: "GitHub"
          url: "https://github.com"
        - label: "Twitter"
          url: "https://twitter.com"

navigation:
  sidebar:
    enabled: true
    maxDepth: 3
  breadcrumbs:
    enabled: true
    homeLabel: "Home"
  prevNext:
    enabled: true
    sameCategoryOnly: false
    sections: {}

assets:
  images:
    enabled: true
    quality: 85
    sizes:
      small: 400
      medium: 800
      large: 1200
    lazyLoading: true
  css:
    enabled: true
    minify: true
  js:
    enabled: true
    minify: true

feeds:
  rss:
    enabled: true
    path: "rss.xml"
    items: 20
    fullContent: false
  atom:
    enabled: true
    path: "atom.xml"
    items: 20

sitemap:
  enabled: true

tags:
  enabled: true

archive:
  enabled: true

pagination:
  enabled: true
  perPage: 10

advanced:
  mermaid:
    enabled: true
    theme: "default"
  graph:
    enabled: true
    path: "graph"
  theme:
    default: "auto"
    allowToggle: true

seo:
  enabled: true
  defaultDescription: "A high-performance static site generator"
  defaultImage: "/assets/images/sample.svg"
  twitter:
    site: ""
    creator: ""
