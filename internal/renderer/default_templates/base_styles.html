{{define "base_styles"}}
    <style>
        :root {
            --sidebar-width: 280px;
            --toc-width: 240px;
            --nav-bg: #f8f9fa;
            --nav-border: #e0e0e0;
            --nav-active: #0066cc;
            --bg-primary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --quote-bg: #f5f9ff;
            --quote-border: #8cb8ee;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-primary);
        }
        /* Header */
        .site-header {
            border-bottom: 1px solid var(--nav-border);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .navbar-logo {
            display: inline-flex;
            align-items: center;
        }
        .navbar-logo img {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            object-fit: cover;
        }
        .site-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .lang-switcher {
            display: inline-flex;
            gap: 4px;
            padding: 3px;
            border: 1px solid var(--nav-border);
            border-radius: 999px;
            background: var(--nav-bg);
        }
        .lang-link {
            border: 0;
            border-radius: 999px;
            padding: 6px 11px;
            font-size: 0.8em;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
        }
        .lang-link.is-active {
            color: #fff;
            background: var(--nav-active);
        }
        .site-nav a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .site-nav a:hover,
        .site-nav a.is-active { color: var(--nav-active); }
        .theme-toggle {
            border: 1px solid var(--nav-border);
            background: transparent;
            width: 36px;
            height: 36px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
        }
        .theme-toggle svg {
            width: 18px;
            height: 18px;
            display: block;
        }
        .theme-toggle .icon-moon { display: none; }
        html[data-theme='dark'] .theme-toggle .icon-sun { display: none; }
        html[data-theme='dark'] .theme-toggle .icon-moon { display: block; }
        html[data-theme='dark'] {
            --nav-bg: #1d1f22;
            --nav-border: #383c42;
            --nav-active: #6aa4ff;
            --bg-primary: #111315;
            --text-primary: #eceef1;
            --text-secondary: #a9adb5;
            --quote-bg: #18212d;
            --quote-border: #4b7ebd;
        }
        /* Layout */
        .site-layout {
            display: flex;
            width: 100%;
            max-width: none;
            margin: 0;
            min-height: calc(100vh - 120px);
        }
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            padding: 20px 16px;
            border-right: 1px solid var(--nav-border);
            background: var(--nav-bg);
            flex-shrink: 0;
            overflow-y: auto;
            max-height: calc(100vh - 60px);
            position: sticky;
            top: 0;
            font-size: 1.05rem;
        }
        .blog-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }
        .sidebar-mode-switch {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            border: 1px solid var(--nav-border);
            background: var(--bg-primary);
            border-radius: 999px;
            padding: 4px;
        }
        .sidebar-mode-btn {
            border: 0;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 999px;
            font-size: 0.78em;
            font-weight: 600;
            padding: 7px 6px;
            cursor: pointer;
        }
        .sidebar-mode-btn.is-active {
            color: #fff;
            background: var(--nav-active);
        }
        .sidebar-mode-pane {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        .sidebar-timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: none;
            overflow: visible;
            padding-right: 2px;
        }
        .timeline-year h4 {
            font-size: 0.86em;
            color: var(--text-secondary);
            margin: 4px 0;
        }
        .timeline-list {
            list-style: none;
            margin: 0;
            padding: 0;
            margin-bottom: 8px;
        }
        .timeline-list li a {
            display: block;
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.86em;
        }
        .timeline-list li a time {
            color: var(--text-secondary);
            margin-right: 6px;
            font-size: 0.9em;
        }
        .timeline-list li.active > a {
            color: var(--nav-active);
            font-weight: 600;
            background: rgba(0, 102, 204, 0.08);
        }
        .sidebar-graph-pane {
            height: calc(100vh - 130px);
        }
        .sidebar-graph-frame {
            width: 100%;
            height: 100%;
            border: 1px solid var(--nav-border);
            border-radius: 8px;
            background: var(--bg-primary);
        }
        .site-layout.sidebar-graph-mode .sidebar {
            width: 40%;
        }
        .site-layout.sidebar-graph-mode .site-content {
            max-width: none;
        }
        .sidebar-menu, .sidebar-submenu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-submenu {
            padding-left: 16px;
            border-left: 1px solid var(--nav-border);
            margin-left: 8px;
        }
        .sidebar-item a {
            display: block;
            padding: 4px 8px;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 4px;
            font-size: 1em;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-section-head {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        /* Keep folder labels aligned with regular items: text starts first,
           while the expand control is pushed to the row end. */
        .sidebar-section-head a {
            flex: 1 1 auto;
            order: 1;
        }
        .sidebar-toggle {
            appearance: none;
            border: 0;
            background: transparent;
            color: var(--text-secondary);
            width: 28px;
            height: 28px;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            flex: 0 0 28px;
            margin-left: auto;
            order: 2;
        }
        .sidebar-toggle:hover {
            background: rgba(0, 102, 204, 0.08);
            color: var(--nav-active);
        }
        .sidebar-toggle::before {
            content: "▸";
            font-size: 1.15em;
            line-height: 1;
            transition: transform 0.15s ease;
        }
        .sidebar-section.expanded > .sidebar-section-head .sidebar-toggle::before {
            transform: rotate(90deg);
        }
        .sidebar-section > .sidebar-submenu {
            display: none;
        }
        .sidebar-section.expanded > .sidebar-submenu {
            display: block;
        }
        .sidebar-item a:hover {
            background: rgba(0, 102, 204, 0.08);
        }
        .sidebar-item.active > a {
            color: var(--nav-active);
            font-weight: 600;
            background: rgba(0, 102, 204, 0.08);
        }
        .sidebar-section > a {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-top: 12px;
        }
        /* Main content */
        .site-content {
            flex: 1;
            min-width: 0;
            padding: 24px 40px;
            max-width: 800px;
        }
        .embed {
            width: 100%;
            max-width: 800px;
            margin: 24px auto;
        }
        .embed iframe {
            display: block;
            width: min(100%, 800px);
            aspect-ratio: 16 / 9;
            height: auto;
            border: 0;
            border-radius: 12px;
        }
        .pdf-embed {
            display: block;
            width: min(100vw - var(--sidebar-width) - 80px, 1120px);
            max-width: calc(100vw - var(--sidebar-width) - 80px);
            min-height: 75vh;
            height: 800px;
            margin: 24px 0;
            border: 1px solid var(--nav-border);
            border-radius: 12px;
            background: var(--bg-primary);
        }
        /* Breadcrumbs */
        .breadcrumbs {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 0;
            margin-bottom: 20px;
            font-size: 0.85em;
            color: var(--text-secondary);
        }
        .breadcrumbs li:not(:last-child)::after {
            content: "›";
            margin-left: 4px;
            color: var(--text-secondary);
        }
        .breadcrumbs a { color: var(--nav-active); text-decoration: none; }
        .breadcrumbs a:hover { text-decoration: underline; }
        /* TOC */
        .toc {
            width: var(--toc-width);
            padding: 20px 16px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            max-height: 100vh;
            overflow-y: auto;
            font-size: 0.85em;
        }
        .toc-title {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .toc-list, .toc-sublist {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .toc-sublist { padding-left: 12px; }
        .toc-item a {
            display: block;
            padding: 3px 0;
            color: var(--text-secondary);
            text-decoration: none;
            border-left: 2px solid transparent;
            padding-left: 8px;
        }
        .toc-item a:hover {
            color: var(--nav-active);
            border-left-color: var(--nav-active);
        }
        .toc-item a.is-active {
            color: var(--nav-active);
            font-weight: 700;
            border-left-color: var(--nav-active);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        /* Prev/Next */
        .prev-next {
            display: flex;
            justify-content: space-between;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--nav-border);
            gap: 20px;
        }
        .prev-next a {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            padding: 12px 16px;
            border: 1px solid var(--nav-border);
            border-radius: 8px;
            flex: 1;
            transition: border-color 0.2s;
        }
        .prev-next a:hover { border-color: var(--nav-active); }
        .prev-next .prev-link { text-align: left; }
        .prev-next .next-link { text-align: right; margin-left: auto; }
        .prev-label, .next-label {
            font-size: 0.8em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .prev-title, .next-title {
            color: var(--nav-active);
            font-weight: 500;
        }
        /* Article */
        article h1 { font-size: 2em; margin-bottom: 8px; }
        article time { color: var(--text-secondary); font-size: 0.9em; }
        .article-meta {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 4px;
            margin: 0 0 8px;
            flex-wrap: nowrap;
        }
        .article-audio {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 0 2px;
        }
        .article-audio button {
            border: 1px solid var(--nav-active);
            border-radius: 999px;
            background: var(--nav-active);
            color: #fff;
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .article-audio button:hover {
            filter: brightness(0.92);
        }
        .article-audio button svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        .article-audio button .icon-stop { display: none; }
        .article-audio button.is-playing .icon-play { display: none; }
        .article-audio button.is-playing .icon-stop { display: block; }
        .article-audio .audio-wave {
            width: 88px;
            height: 28px;
            border: 0;
            border-radius: 0;
            background: transparent;
            opacity: 0.95;
        }
        .article-audio button:disabled {
            opacity: 0.55;
            cursor: default;
        }
        article .tags { margin: 22px 0 24px; }
        article .tag {
            display: inline-block;
            background: var(--nav-bg);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            color: var(--nav-active);
            margin-right: 4px;
            text-decoration: none;
        }
        article .tag:hover { text-decoration: underline; }
        article .content { margin-top: 16px; }
        article .content h2 { margin-top: 2em; margin-bottom: 0.5em; }
        article .content h3 { margin-top: 1.5em; margin-bottom: 0.4em; }
        article .content p { margin-bottom: 1em; }
        article .content blockquote {
            margin: 1.4em 0;
            padding: 0.8em 1em;
            border-left: 4px solid var(--quote-border);
            background: var(--quote-bg);
            color: var(--text-secondary);
            font-style: italic;
        }
        article .content blockquote p:last-child {
            margin-bottom: 0;
        }
        /* Footer */
        .site-footer {
            border-top: 1px solid var(--nav-border);
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.9em;
            text-align: center;
        }
        /* Standard elements */
        a { color: var(--nav-active); text-decoration: none; }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; height: auto; }
        pre {
            background: #f4f4f4;
            padding: 15px;
            overflow-x: auto;
            border-radius: 4px;
        }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "Monaco", "Menlo", monospace;
        }
        pre code { padding: 0; background: none; }
        table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
        .section-index { list-style: none; padding: 0; }
        .section-index li { padding: 6px 0; border-bottom: 1px solid var(--nav-border); }
        .section-index li a { font-weight: 500; }
        .section-article-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .section-article-preview {
            border-bottom: 1px solid var(--nav-border);
            padding-bottom: 22px;
        }
        .section-article-image {
            display: block;
            margin: 0 0 14px;
            border-radius: 14px;
            overflow: hidden;
            background: var(--nav-bg);
        }
        .section-article-image:hover {
            background: transparent;
        }
        .section-article-image .md-image,
        .section-article-image picture,
        .section-article-image img {
            display: block;
            width: 100%;
        }
        .section-article-image .md-image {
            margin: 0;
        }
        .section-article-image img {
            max-height: 320px;
            object-fit: cover;
        }
        .section-article-preview h2 {
            margin: 0 0 8px;
            font-size: clamp(1.45rem, 2.2vw, 2rem);
            line-height: 1.18;
        }
        .section-article-preview h2 a {
            color: var(--text-primary);
        }
        .section-article-preview time {
            display: block;
            color: var(--text-secondary);
            font-size: 0.83em;
            margin-bottom: 6px;
        }
        .section-article-preview p {
            margin: 0;
            color: var(--text-secondary);
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin: 32px 0 0;
        }
        .project-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow);
        }
        .project-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--border);
            display: block;
        }
        .project-content {
            padding: 20px;
        }
        .project-content h3 {
            margin: 0 0 8px;
            font-size: 1.25em;
        }
        .project-content p {
            margin: 0 0 16px;
            color: var(--text-secondary);
            font-size: 0.95em;
        }
        .project-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .project-tag {
            font-size: 0.8em;
            padding: 4px 10px;
            background: var(--bg-primary);
            border-radius: 20px;
            color: var(--text-secondary);
        }
        /* Responsive */
        @media (max-width: 1200px) {
            .toc { display: none; }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .site-content { padding: 16px; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
{{end}}
